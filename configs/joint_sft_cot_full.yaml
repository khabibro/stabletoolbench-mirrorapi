### model
model_name_or_path: ${MIRRORAPI_BASE_MODEL:-/home/khabibillo/models/Qwen2.5-7B-Instruct}
trust_remote_code: false
flash_attn: auto

### method
stage: sft
do_train: true
finetuning_type: full

### dataset
# BLOCKED until docs/training_data_audit.md marks the public joint composition VERIFIED.
dataset: mirrorapi_joint_train
template: qwen
cutoff_len: 2560
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: ${MIRRORAPI_OUTPUT_DIR:-/home/khabibillo/checkpoints/mirrorapi-joint-sft-cot-full}
overwrite_output_dir: false
save_steps: 500
save_total_limit: 3

### training
# Local defaults only; not claimed as official.
per_device_train_batch_size: 2
gradient_accumulation_steps: 16
num_train_epochs: 5
learning_rate: 2.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
bf16: true
seed: 42

### evaluation
do_eval: false

### logging
logging_steps: 10
report_to: none
plot_loss: true

### distributed setup
# Local adaptation for 4 GPUs: 4 * 2 * 16 = 128 effective global batch size.
