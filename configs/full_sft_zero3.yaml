### model
model_name_or_path: ${MIRRORAPI_BASE_MODEL:-/home/khabibillo/models/Qwen2.5-7B-Instruct}
trust_remote_code: false
flash_attn: auto

### method
# Paper-oriented full-parameter SFT with optimizer-state sharding.
# This config is prepared for validation only. Do not launch expensive full training yet.
stage: sft
do_train: true
finetuning_type: full
deepspeed: ../configs/deepspeed_zero3.json

### dataset
dataset: mirrorapi_sft_train
template: qwen
cutoff_len: 2560
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: ${MIRRORAPI_OUTPUT_DIR:-/home/khabibillo/checkpoints/mirrorapi-full-sft-zero3}
overwrite_output_dir: false
save_steps: 500
save_total_limit: 3
save_only_model: false

### training
# Official exact hyperparameters remain partly unknown. Values here preserve the
# earlier local adaptation where possible and use LLaMA-Factory-supported ZeRO-3.
per_device_train_batch_size: 1
gradient_accumulation_steps: 43
num_train_epochs: 5
learning_rate: 2.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
bf16: true
seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null

### evaluation
do_eval: false

### logging
logging_steps: 10
report_to: none
plot_loss: true

### distributed setup
# Launch only after LoRA smoke passes and DeepSpeed is installed/validated:
# CUDA_VISIBLE_DEVICES=0,1,3 FORCE_TORCHRUN=1 NPROC_PER_NODE=3 bash scripts/run_sft_training.sh --config configs/full_sft_zero3.yaml
# Effective global batch size: 3 GPUs * 1 sample/GPU * 43 grad accumulation = 129.
# This is a local adaptation to avoid GPU 2 and approximate the 128 batch concept.
